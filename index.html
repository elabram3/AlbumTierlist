<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tierlist de Álbum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* layout: una sola columna tipo historia; buscador arriba, tablero al centro, banco de canciones abajo */
:root{
  --bg:#17171b; --panel:#24242a; --row:#2e2e35; --line:#3a3a43;
  --fg:#f3f2f7; --muted:#a3a2ad; --tile:#2d3bff; --tile-fg:#ffffff; --pick:#ffe14d;
  --t1:#ff2a2a; --t2:#ff9800; --t3:#ffe83d; --t4:#7fb24c; --t5:#2196f3;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:18px}

/* encabezado */
header h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted)}

/* buscador */
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:12px 14px;font:inherit}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--fg);color:var(--bg)}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible,.tile:focus-visible,.drop:focus-visible{outline:3px solid var(--pick);outline-offset:2px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:14px}
.note b{color:var(--fg)}
.results{display:flex;flex-direction:column;gap:6px}
.result{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:12px;padding:8px;text-align:left;color:var(--fg);font-weight:600}
.result img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--row)}
.sec{margin:8px 0 2px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;font-weight:700}
.chip img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--row)}
.chip small{color:var(--muted);font-weight:600;font-size:12px}
.back{align-self:flex-start;background:transparent;color:var(--muted);padding:4px 0;font-weight:600}
.result small{display:block;color:var(--muted);font-weight:400}
details{background:var(--panel);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:700}
textarea{width:100%;box-sizing:border-box;min-height:140px;margin-top:10px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.row2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row2 input{flex:1;min-width:120px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}

/* álbum activo */
.album{display:flex;align-items:center;justify-content:space-between;gap:12px}
.album-text{min-width:0;display:flex;flex-direction:column;gap:4px}
.album img{width:64px;height:64px;flex:0 0 64px;border-radius:10px;object-fit:cover}
.album h2{font-family:var(--display);font-size:22px;margin:0;line-height:1.1}
.album span{color:var(--muted);font-size:14px}
.hint{color:var(--muted);font-size:13px;margin:-8px 0 0}

/* tablero */
.board{display:flex;flex-direction:column;gap:8px}
.drop{display:flex;background:var(--row);border-radius:16px;min-height:84px;overflow:hidden;cursor:pointer}
.drop.armed{box-shadow:0 0 0 2px var(--pick) inset}
.label{flex:0 0 92px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:22px;color:#1a1a1a;border-radius:16px;text-align:center;padding:6px;line-height:1.05}
.cells{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;padding:6px;align-content:flex-start}
.tile{background:var(--tile);color:var(--tile-fg);border-radius:12px;padding:8px 10px;font-weight:700;font-size:13px;line-height:1.15;width:calc(33.33% - 4px);box-sizing:border-box;min-height:58px;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;cursor:pointer;user-select:none;transition:transform .12s}
.tile.sel{box-shadow:0 0 0 3px var(--pick);transform:scale(.96)}
.bank{background:var(--panel);border-radius:16px;padding:10px}
.bank h3{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:600}
.bank .cells{padding:0}
.bank .tile{width:calc(33.33% - 4px)}
.empty{color:var(--muted);font-size:13px;padding:6px}

/* acciones */
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1 1 140px}
button.danger{color:#ff6b6b;border-color:#5a2a2e}
button.danger.confirm{background:#ff4d4d;color:#17171b;border-color:#ff4d4d}
.preview{display:flex;flex-direction:column;gap:10px;align-items:center}
.preview img{width:100%;max-width:360px;border-radius:14px;border:1px solid var(--line)}
.preview p{margin:0;color:var(--muted);font-size:13px;text-align:center}
@medi
</head>
<body>
a (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>Tierlist de Álbum</h1>
    <p>Busca un disco, acomoda cada canción en su fila y descárgalo para tu historia.</p>
  </header>

  <form class="search" id="searchForm">
    <input id="q" type="search" placeholder="Artista o álbum" autocomplete="off">
    <button type="submit">Buscar</button>
  </form>
  <div id="searchMsg" class="note" hidden></div>
  <div id="results" class="results"></div>

  <details id="manual">
    <summary>Escribir las canciones a mano</summary>
    <div class="row2">
      <input id="mAlbum" placeholder="Álbum">
      <input id="mArtist" placeholder="Artista">
    </div>
    <textarea id="mTracks" placeholder="Una canción por línea"></textarea>
    <div class="row2"><button type="button" id="mLoad">Cargar canciones</button></div>
  </details>

  <div class="album">
    <div class="album-text">
      <h2 id="albumTitle"></h2>
      <span id="albumArtist"></span>
    </div>
    <img id="albumCover" alt="Portada del álbum" hidden>
  </div>
  <p class="hint">Toca una canción y luego toca la fila donde va.</p>

  <div class="board" id="board"></div>

  <div class="bank drop" id="bank" data-tier="-1">
    <div style="flex:1;min-width:0">
      <h3>Sin acomodar</h3>
      <div class="cells" id="bankCells"></div>
    </div>
  </div>

  <div class="actions">
    <button type="button" id="exportBtn">Crear imagen para historia</button>
    <button type="button" class="ghost" id="resetBtn">Desacomodar</button>
    <button type="button" class="ghost danger" id="clearBtn">Borrar todo</button>
  </div>
  <div class="preview" id="preview" hidden>
    <img id="previewImg" alt="Tu tierlist lista para historia">
    <p id="previewMsg">Guárdala o compártela directo a tu historia.</p>
    <button type="button" id="saveBtn" hidden>Descargar PNG</button>
  </div>
</div>

<script>
// ===== datos =====
const TIERS=[
  {label:"uff 🔥",color:"--t1"},
  {label:"😩👌",color:"--t2"},
  {label:"Bien 👍",color:"--t3"},
  {label:"Mid 🟰",color:"--t4"},
  {label:"Skip ⏭️",color:"--t5"}
];
let state={album:"",artist:"",tracks:[]};
let selected=null;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $=id=>document.getElementById(id);

// ===== álbum =====
function setAlbum(album,artist,titles,place){
  state={album,artist,tracks:titles.map((t,i)=>({id:i,title:t,tier:place?place[i]:-1}))};
  setCover(null);
  selected=null;$("preview").hidden=true;render();
}

// ===== tablero =====
function tileEl(t){
  const d=document.createElement("div");
  d.className="tile"+(selected===t.id?" sel":"");
  d.textContent=t.title;d.tabIndex=0;d.setAttribute("role","button");
  const pick=e=>{e.stopPropagation();selected=selected===t.id?null:t.id;render()};
  d.addEventListener("click",pick);
  d.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(e)}});
  return d;
}
function place(tier){
  if(selected===null)return;
  const t=state.tracks.find(x=>x.id===selected);
  if(t){t.tier=tier;selected=null;render()}
}
function render(){
  $("albumTitle").textContent=state.album||"Elige un álbum";
  $("albumArtist").textContent=state.artist||"";
  const board=$("board");board.innerHTML="";
  TIERS.forEach((tr,i)=>{
    const row=document.createElement("div");
    row.className="drop"+(selected!==null?" armed":"");row.tabIndex=0;
    const lab=document.createElement("div");lab.className="label";
    lab.style.background=`var(${tr.color})`;lab.textContent=tr.label;
    const cells=document.createElement("div");cells.className="cells";
    state.tracks.filter(t=>t.tier===i).forEach(t=>cells.appendChild(tileEl(t)));
    row.append(lab,cells);
    row.addEventListener("click",()=>place(i));
    row.addEventListener("keydown",e=>{if(e.key==="Enter")place(i)});
    board.appendChild(row);
  });
  const bank=$("bankCells");bank.innerHTML="";
  const rest=state.tracks.filter(t=>t.tier===-1);
  if(!rest.length){const e=document.createElement("div");e.className="empty";e.textContent=state.tracks.length?"Todas acomodadas. Toca una para moverla.":"Busca un álbum arriba para empezar.";bank.appendChild(e)}
  rest.forEach(t=>bank.appendChild(tileEl(t)));
  $("bank").classList.toggle("armed",selected!==null);
}
$("bank").addEventListener("click",()=>place(-1));

// ===== búsqueda (Deezer) =====
const MIN_FANS=10000;
function jsonp(url){
  return new Promise((res,rej)=>{
    const cb="cb"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();rej(new Error("timeout"))},8000);
    function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}
    window[cb]=d=>{cleanup();d&&d.error?rej(new Error(d.error.message||"api")):res(d)};
    s.onerror=()=>{cleanup();rej(new Error("blocked"))};
    s.src=url+(url.includes("?")?"&":"?")+"output=jsonp&callback="+cb;
    document.head.appendChild(s);
  });
}
const dz=path=>jsonp("https://api.deezer.com/"+path);
const JUNK=/karaoke|tribute|lullab|rockabye|renditions?\b|covers?\b|instrumental|bass boosted|made famous|in the style of|originally performed|as performed|8d audio|slowed|sped up|lo-?fi|piano version|reggae version|ringtone|workout|relax|for babies|for kids|twinkle|cover band|party hits|versiones?\b|homenaje|estilo de|\((reggae|cumbia|bachata|chill|piano|guitar|guitarra|lullaby)[^)]*\)/i;
const OK_TYPE=t=>t==="album"||t==="ep";
function fans(n){return n>=1e6?(n/1e6).toFixed(1).replace(".0","")+" M fans":n>=1e3?Math.round(n/1e3)+" mil fans":n+" fans"}
function year(d){return d?String(d).slice(0,4):""}
function msg(html){const m=$("searchMsg");m.hidden=!html;m.innerHTML=html||""}
function sec(text){const h=document.createElement("div");h.className="sec";h.textContent=text;$("results").appendChild(h)}
function albumBtn(a,artistName){
  const b=document.createElement("button");b.type="button";b.className="result";
  const img=document.createElement("img");img.src=a.cover_medium||"";img.alt="";
  const t=document.createElement("div");t.textContent=a.title;
  const s=document.createElement("small");
  const parts=[artistName||(a.artist&&a.artist.name)||"",year(a.release_date),a.nb_tracks?a.nb_tracks+" canciones":(a.record_type==="ep"?"EP":"")].filter(Boolean);
  s.textContent=parts.join(" · ");t.appendChild(s);
  b.append(img,t);b.addEventListener("click",()=>pickAlbum(a,artistName));
  $("results").appendChild(b);
}
let lastSearch=null;
async function showArtist(ar){
  $("results").innerHTML="";msg("Cargando discografía…");
  try{
    const d=await dz(`artist/${ar.id}/albums?limit=200`);
    const seen=new Set();
    const list=(d.data||[]).filter(x=>OK_TYPE(x.record_type)&&!JUNK.test(x.title))
      .filter(x=>{const k=x.title.toLowerCase();if(seen.has(k))return false;seen.add(k);return true})
      .sort((x,y)=>String(y.release_date).localeCompare(String(x.release_date)));
    msg(list.length?"":"Este artista no tiene álbumes disponibles.");
    const back=document.createElement("button");back.type="button";back.className="back";back.textContent="← Volver a resultados";
    back.addEventListener("click",()=>lastSearch&&renderSearch(lastSearch));
    $("results").appendChild(back);
    sec(`Discografía de ${ar.name}`);
    list.forEach(x=>albumBtn(x,ar.name));
  }catch(e){msg("No pude cargar la discografía. Intenta de nuevo.")}
}
function renderSearch({artists,albums}){
  $("results").innerHTML="";
  if(!artists.length&&!albums.length){msg("No encontré artistas o álbumes conocidos con ese nombre.");return}
  msg("");
  if(artists.length){
    sec("Artistas");
    const c=document.createElement("div");c.className="chips";
    artists.forEach(ar=>{
      const b=document.createElement("button");b.type="button";b.className="chip";
      const img=document.createElement("img");img.src=ar.picture_small||"";img.alt="";
      const n=document.createElement("span");n.textContent=ar.name;
      const f=document.createElement("small");f.textContent=fans(ar.nb_fan);
      b.append(img,n,f);b.addEventListener("click",()=>showArtist(ar));c.appendChild(b);
    });
    $("results").appendChild(c);
  }
  if(albums.length){sec("Álbumes");albums.forEach(x=>albumBtn(x))}
}
$("searchForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const q=$("q").value.trim();if(!q)return;
  $("results").innerHTML="";msg("Buscando…");
  try{
    const term=encodeURIComponent(q);
    const [ar,al]=await Promise.all([dz(`search/artist?q=${term}&limit=10`),dz(`search/album?q=${term}&limit=25`)]);
    const artists=(ar.data||[]).filter(x=>x.nb_fan>=MIN_FANS&&!JUNK.test(x.name)).slice(0,4);
    let albums=(al.data||[]).filter(x=>OK_TYPE(x.record_type)&&x.nb_tracks>3&&!JUNK.test(x.title)&&!JUNK.test(x.artist.name));
    const ids=[...new Set(albums.map(x=>x.artist.id))].slice(0,10);
    const known={};artists.forEach(x=>known[x.id]=x.nb_fan);
    const info=await Promise.all(ids.filter(id=>!(id in known)).map(id=>dz(`artist/${id}`).catch(()=>null)));
    info.forEach(x=>{if(x)known[x.id]=x.nb_fan||0});
    albums=albums.filter(x=>(known[x.artist.id]||0)>=MIN_FANS).slice(0,8);
    lastSearch={artists,albums};
    renderSearch(lastSearch);
  }catch(err){
    msg("<b>La búsqueda no respondió.</b> Revisa tu conexión e intenta de nuevo, o usa “Escribir las canciones a mano”.");
  }
});
async function pickAlbum(a,artistName){
  msg("Cargando canciones…");$("results").innerHTML="";
  try{
    const d=await dz(`album/${a.id}/tracks?limit=200`);
    const songs=(d.data||[]).map(x=>x.title);
    if(!songs.length)throw new Error("empty");
    msg("");setAlbum(a.title,artistName||(a.artist&&a.artist.name)||"",songs);
    colorFromCover(a.cover_medium);setCover(a.cover_big||a.cover_medium);
  }catch(e){msg("No pude cargar las canciones de ese álbum.")}
}

// ===== color del álbum =====
const DEFAULT_TILE=["#2d3bff","#ffffff"];
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6}return[h,s,l]}
function hsl2rgb(h,s,l){if(!s)return[l*255,l*255,l*255].map(Math.round);
  const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q,f=t=>{t<0&&t++;t>1&&t--;return t<1/6?p+(q-p)*6*t:t<1/2?q:t<2/3?p+(q-p)*(2/3-t)*6:p};
  return[f(h+1/3),f(h),f(h-1/3)].map(v=>Math.round(v*255))}
function lum(r,g,b){const c=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*c(r)+.7152*c(g)+.0722*c(b)}
function hex(r,g,b){return"#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("")}
function pickColor(img){
  const c=document.createElement("canvas");c.width=c.height=40;
  const x=c.getContext("2d");x.drawImage(img,0,0,40,40);
  const px=x.getImageData(0,0,40,40).data;
  const bins={};let gray={r:0,g:0,b:0,n:0};
  for(let i=0;i<px.length;i+=4){
    const r=px[i],g=px[i+1],b=px[i+2];const [h,s,l]=rgb2hsl(r,g,b);
    if(s<.2||l<.1||l>.92){gray.r+=r;gray.g+=g;gray.b+=b;gray.n++;continue}
    const k=Math.floor(h*18);const w=s*(1-Math.abs(l-.5));
    const o=bins[k]||(bins[k]={r:0,g:0,b:0,n:0,w:0});o.r+=r;o.g+=g;o.b+=b;o.n++;o.w+=w;
  }
  const best=Object.values(bins).filter(o=>o.n>=16).sort((a,b)=>b.w-a.w)[0];
  let [h,s,l]=best?rgb2hsl(best.r/best.n,best.g/best.n,best.b/best.n):rgb2hsl(gray.r/gray.n,gray.g/gray.n,gray.b/gray.n);
  l=Math.min(.62,Math.max(.32,l));if(best)s=Math.max(s,.45);
  const [r,g,b]=hsl2rgb(h,s,l);
  const L=lum(r,g,b),cw=1.05/(L+.05),cd=(L+.05)/(lum(17,17,17)+.05);
  return[hex(r,g,b),cw>=cd?"#ffffff":"#111111"];
}
function applyTile([bg,fg]){const r=document.documentElement.style;r.setProperty("--tile",bg);r.setProperty("--tile-fg",fg)}
let coverImg=null;
function setCover(url){
  coverImg=null;const el=$("albumCover");el.hidden=true;el.removeAttribute("src");
  if(!url)return;
  const img=new Image();img.crossOrigin="anonymous";
  img.onload=()=>{coverImg=img;el.src=url;el.hidden=false};
  img.src=url;
}
function colorFromCover(url){
  applyTile(DEFAULT_TILE);if(!url)return;
  const img=new Image();img.crossOrigin="anonymous";
  img.onload=()=>{try{const c=pickColor(img);state.tile=c;applyTile(c)}catch(e){}};
  img.src=url;
}

// ===== captura manual =====
$("mLoad").addEventListener("click",()=>{
  const titles=$("mTracks").value.split("\n").map(s=>s.trim()).filter(Boolean);
  if(!titles.length)return;
  setAlbum($("mAlbum").value.trim()||"Mi álbum",$("mArtist").value.trim(),titles);applyTile(DEFAULT_TILE);
  $("manual").open=false;
});
$("resetBtn").addEventListener("click",()=>{state.tracks.forEach(t=>t.tier=-1);selected=null;render()});
let clearTimer=null;
$("clearBtn").addEventListener("click",()=>{
  const b=$("clearBtn");
  if(!b.classList.contains("confirm")){
    b.classList.add("confirm");b.textContent="¿Seguro? Toca otra vez";
    clearTimer=setTimeout(()=>{b.classList.remove("confirm");b.textContent="Borrar todo"},3000);
    return;
  }
  clearTimeout(clearTimer);b.classList.remove("confirm");b.textContent="Borrar todo";
  state={album:"",artist:"",tracks:[]};selected=null;lastSearch=null;lastBlob=null;
  $("q").value="";$("results").innerHTML="";msg("");$("preview").hidden=true;applyTile(DEFAULT_TILE);setCover(null);
  render();window.scrollTo({top:0,behavior:"smooth"});$("q").focus({preventScroll:true});
});

// ===== imagen 1080x1920 =====
function wrapLines(ctx,text,maxW){
  const words=text.split(" ");const lines=[];let cur="";
  words.forEach(w=>{const test=cur?cur+" "+w:w;if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=w}else cur=test});
  if(cur)lines.push(cur);return lines;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
async function exportImage(){
  await document.fonts.ready;
  const W=1080,H=1920,c=document.createElement("canvas");c.width=W;c.height=H;
  const ctx=c.getContext("2d");
  ctx.fillStyle=css("--bg");ctx.fillRect(0,0,W,H);
  // medidas
  const M=48,SAFE_TOP=220,SAFE_BOTTOM=240,labW=200,gap=12,area=W-2*M-labW-gap*2;
  ctx.font=`800 64px ${css("--display")}`;
  const COV=coverImg?160:0,textW=W-2*M-(COV?COV+28:0);
  const tl=wrapLines(ctx,state.album||"Mi álbum",textW).slice(0,2);
  const textH=tl.length*70+(state.artist?58:0);
  const headH=Math.max(textH,COV)+40;
  const counts=TIERS.map((_,i)=>state.tracks.filter(t=>t.tier===i).length);
  const rowsH=(cols,tileH)=>counts.reduce((s,n)=>{const l=Math.max(1,Math.ceil(n/cols));return s+l*tileH+(l-1)*8+24},0)+gap*(TIERS.length-1);
  const room=H-SAFE_TOP-SAFE_BOTTOM-headH;
  let cols=5,tileH=60;
  let bestA=0;
  for(let k=3;k<=5;k++){const w=(area-(k-1)*8)/k;
    for(let h=Math.round(Math.min(170,w*.7));h>=60;h-=4){if(rowsH(k,h)<=room){if(w*h>bestA){bestA=w*h;cols=k;tileH=h}break}}}
  const blockH=headH+rowsH(cols,tileH);
  let y=SAFE_TOP+Math.max(0,(H-SAFE_TOP-SAFE_BOTTOM-blockH)/2);
  // encabezado
  ctx.textBaseline="alphabetic";ctx.fillStyle=css("--fg");ctx.font=`800 64px ${css("--display")}`;
  const headTop=y,textTop=y+Math.max(0,(COV-textH)/2);
  if(COV){ctx.save();ctx.beginPath();ctx.roundRect(W-M-COV,headTop,COV,COV,22);ctx.clip();ctx.drawImage(coverImg,W-M-COV,headTop,COV,COV);ctx.restore()}
  y=textTop+56;tl.forEach((l,i)=>{ctx.fillText(l,M,y);if(i<tl.length-1)y+=70});
  if(state.artist){y+=58;ctx.fillStyle=css("--muted");ctx.font=`600 34px ${css("--body")}`;ctx.fillText(state.artist,M,y)}
  y=headTop+headH;
  const tileW=(area-(cols-1)*8)/cols;
  TIERS.forEach((tr,i)=>{
    const items=state.tracks.filter(t=>t.tier===i);
    const lines=Math.max(1,Math.ceil(items.length/cols));
    const rowH=lines*tileH+(lines-1)*8+24;
    ctx.fillStyle=css("--row");rr(ctx,M,y,W-2*M,rowH,28);
    ctx.fillStyle=css(tr.color);rr(ctx,M,y,labW,rowH,28);
    ctx.fillStyle="#1a1a1a";ctx.textAlign="center";ctx.textBaseline="middle";
    const maxLW=labW-28;let lfs=46,lbl=[tr.label];
    const fits=()=>lbl.every(l=>ctx.measureText(l).width<=maxLW);
    for(;lfs>=32;lfs-=2){ctx.font=`800 ${lfs}px ${css("--display")}`;if(fits())break}
    if(!fits()&&tr.label.includes(" ")){
      const i=tr.label.lastIndexOf(" ");lbl=[tr.label.slice(0,i),tr.label.slice(i+1)];
      for(lfs=46;lfs>20;lfs-=2){ctx.font=`800 ${lfs}px ${css("--display")}`;if(fits())break}
    }
    const llh=lfs*1.15;
    lbl.forEach((l,j)=>ctx.fillText(l,M+labW/2,y+rowH/2+(j-(lbl.length-1)/2)*llh));
    items.forEach((t,k)=>{
      const cx=M+labW+gap+(k%cols)*(tileW+8),cy=y+12+Math.floor(k/cols)*(tileH+8);
      ctx.fillStyle=css("--tile");rr(ctx,cx,cy,tileW,tileH,20);
      ctx.fillStyle=css("--tile-fg");
      let fs=Math.min(40,Math.round(tileH/4)),ls;
      do{ctx.font=`700 ${fs}px ${css("--body")}`;ls=wrapLines(ctx,t.title,tileW-20);fs-=2}
      while((ls.length*fs*1.15>tileH-16||ls.some(l=>ctx.measureText(l).width>tileW-16))&&fs>14);
      const lh=(fs+2)*1.15,sy=cy+tileH/2-(ls.length-1)*lh/2;
      ls.forEach((l,j)=>ctx.fillText(l,cx+tileW/2,sy+j*lh));
    });
    ctx.textAlign="left";ctx.textBaseline="alphabetic";
    y+=rowH+gap;
  });
  ctx.textAlign="center";
  ctx.fillStyle=css("--fg");ctx.font=`700 34px ${css("--body")}`;
  ctx.fillText("Haz el tuyo",W/2,H-150);
  ctx.fillStyle=css("--muted");ctx.font=`600 30px ${css("--body")}`;
  ctx.fillText("elabram3.github.io/AlbumTierlist",W/2,H-106);
  return c;
}
let lastBlob=null;
$("exportBtn").addEventListener("click",async()=>{
  const c=await exportImage();
  $("previewImg").src=c.toDataURL("image/png");$("preview").hidden=false;
  c.toBlob(b=>lastBlob=b,"image/png");
  $("preview").scrollIntoView({behavior:"smooth",block:"start"});
});
$("saveBtn").hidden=false;
$("saveBtn").textContent="Guardar o compartir";
$("saveBtn").addEventListener("click",async()=>{
  if(!lastBlob)return;
  const name=(state.album||"tierlist").replace(/[^\w\- ]+/g,"")+" tierlist.png";
  const file=new File([lastBlob],name,{type:"image/png"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(lastBlob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
});

// ===== inicio =====
render();
</script>
