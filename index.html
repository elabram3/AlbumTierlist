<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tierlist de Álbum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* layout: una sola columna tipo historia; buscador arriba, tablero al centro, banco de canciones abajo */
:root{
  --bg:#17171b; --panel:#24242a; --row:#2e2e35; --line:#3a3a43;
  --fg:#f3f2f7; --muted:#a3a2ad; --tile:#2d3bff; --tile-fg:#ffffff; --pick:#ffe14d;
  --t1:#ff2a2a; --t2:#ff9800; --t3:#ffe83d; --t4:#7fb24c; --t5:#2196f3;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:18px}

/* encabezado */
header h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted)}

/* buscador */
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:12px 14px;font:inherit}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--fg);color:var(--bg)}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible,.tile:focus-visible,.drop:focus-visible{outline:3px solid var(--pick);outline-offset:2px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:14px}
.note b{color:var(--fg)}
.results{display:flex;flex-direction:column;gap:6px}
.result{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:12px;padding:8px;text-align:left;color:var(--fg);font-weight:600}
.result img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--row)}
.sec{margin:8px 0 2px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700}
.back{align-self:flex-start;background:transparent;color:var(--muted);padding:4px 0;font-weight:600}
.result small{display:block;color:var(--muted);font-weight:400}
details{background:var(--panel);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:700}
textarea{width:100%;box-sizing:border-box;min-height:140px;margin-top:10px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.row2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row2 input{flex:1;min-width:120px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}

/* álbum activo */
.album{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.album h2{font-family:var(--display);font-size:22px;margin:0;line-height:1.1}
.album span{color:var(--muted);font-size:14px}
.hint{color:var(--muted);font-size:13px;margin:-8px 0 0}

/* tablero */
.board{display:flex;flex-direction:column;gap:8px}
.drop{display:flex;background:var(--row);border-radius:16px;min-height:84px;overflow:hidden;cursor:pointer}
.drop.armed{box-shadow:0 0 0 2px var(--pick) inset}
.label{flex:0 0 92px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:22px;color:#1a1a1a;border-radius:16px;text-align:center;padding:6px;line-height:1.05}
.cells{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;padding:6px;align-content:flex-start}
.tile{background:var(--tile);color:var(--tile-fg);border-radius:12px;padding:8px 10px;font-weight:700;font-size:13px;line-height:1.15;width:calc(33.33% - 4px);box-sizing:border-box;min-height:58px;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;cursor:pointer;user-select:none;transition:transform .12s}
.tile.sel{box-shadow:0 0 0 3px var(--pick);transform:scale(.96)}
.bank{background:var(--panel);border-radius:16px;padding:10px}
.bank h3{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:600}
.bank .cells{padding:0}
.bank .tile{width:calc(33.33% - 4px)}
.empty{color:var(--muted);font-size:13px;padding:6px}

/* acciones */
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1}
.preview{display:flex;flex-direction:column;gap:10px;align-items:center}
.preview img{width:100%;max-width:360px;border-radius:14px;border:1px solid var(--line)}
.preview p{margin:0;color:var(--muted);font-size:13px;text-align:center}
@medi
</head>
<body>
a (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>Tierlist de Álbum</h1>
    <p>Busca un disco, acomoda cada canción en su fila y descárgalo para tu historia.</p>
  </header>

  <form class="search" id="searchForm">
    <input id="q" type="search" placeholder="Artista o álbum, ej. nsqk" autocomplete="off">
    <button type="submit">Buscar</button>
  </form>
  <div id="searchMsg" class="note" hidden></div>
  <div id="results" class="results"></div>

  <details id="manual">
    <summary>Escribir las canciones a mano</summary>
    <div class="row2">
      <input id="mAlbum" placeholder="Álbum">
      <input id="mArtist" placeholder="Artista">
    </div>
    <textarea id="mTracks" placeholder="Una canción por línea"></textarea>
    <div class="row2"><button type="button" id="mLoad">Cargar canciones</button></div>
  </details>

  <div class="album">
    <h2 id="albumTitle"></h2>
    <span id="albumArtist"></span>
  </div>
  <p class="hint">Toca una canción y luego toca la fila donde va.</p>

  <div class="board" id="board"></div>

  <div class="bank drop" id="bank" data-tier="-1">
    <div style="flex:1;min-width:0">
      <h3>Sin acomodar</h3>
      <div class="cells" id="bankCells"></div>
    </div>
  </div>

  <div class="actions">
    <button type="button" id="exportBtn">Crear imagen para historia</button>
    <button type="button" class="ghost" id="resetBtn">Reiniciar</button>
  </div>
  <div class="preview" id="preview" hidden>
    <img id="previewImg" alt="Tu tierlist lista para historia">
    <p id="previewMsg">Guárdala o compártela directo a tu historia.</p>
    <button type="button" id="saveBtn" hidden>Descargar PNG</button>
  </div>
</div>

<script>
// ===== datos =====
const TIERS=[
  {label:"uff 🔥",color:"--t1"},
  {label:"😩👌",color:"--t2"},
  {label:"Bien 👍",color:"--t3"},
  {label:"Mid 🟰",color:"--t4"},
  {label:"Skip ⏭️",color:"--t5"}
];
let state={album:"",artist:"",tracks:[]};
let selected=null;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $=id=>document.getElementById(id);

// ===== álbum =====
function setAlbum(album,artist,titles,place){
  state={album,artist,tracks:titles.map((t,i)=>({id:i,title:t,tier:place?place[i]:-1}))};
  selected=null;$("preview").hidden=true;render();
}

// ===== tablero =====
function tileEl(t){
  const d=document.createElement("div");
  d.className="tile"+(selected===t.id?" sel":"");
  d.textContent=t.title;d.tabIndex=0;d.setAttribute("role","button");
  const pick=e=>{e.stopPropagation();selected=selected===t.id?null:t.id;render()};
  d.addEventListener("click",pick);
  d.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(e)}});
  return d;
}
function place(tier){
  if(selected===null)return;
  const t=state.tracks.find(x=>x.id===selected);
  if(t){t.tier=tier;selected=null;render()}
}
function render(){
  $("albumTitle").textContent=state.album||"Elige un álbum";
  $("albumArtist").textContent=state.artist||"";
  const board=$("board");board.innerHTML="";
  TIERS.forEach((tr,i)=>{
    const row=document.createElement("div");
    row.className="drop"+(selected!==null?" armed":"");row.tabIndex=0;
    const lab=document.createElement("div");lab.className="label";
    lab.style.background=`var(${tr.color})`;lab.textContent=tr.label;
    const cells=document.createElement("div");cells.className="cells";
    state.tracks.filter(t=>t.tier===i).forEach(t=>cells.appendChild(tileEl(t)));
    row.append(lab,cells);
    row.addEventListener("click",()=>place(i));
    row.addEventListener("keydown",e=>{if(e.key==="Enter")place(i)});
    board.appendChild(row);
  });
  const bank=$("bankCells");bank.innerHTML="";
  const rest=state.tracks.filter(t=>t.tier===-1);
  if(!rest.length){const e=document.createElement("div");e.className="empty";e.textContent=state.tracks.length?"Todas acomodadas. Toca una para moverla.":"Busca un álbum arriba para empezar.";bank.appendChild(e)}
  rest.forEach(t=>bank.appendChild(tileEl(t)));
  $("bank").classList.toggle("armed",selected!==null);
}
$("bank").addEventListener("click",()=>place(-1));

// ===== búsqueda (iTunes) =====
function jsonp(url){
  return new Promise((res,rej)=>{
    const cb="cb"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();rej(new Error("timeout"))},6000);
    function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}
    window[cb]=d=>{cleanup();res(d)};
    s.onerror=()=>{cleanup();rej(new Error("blocked"))};
    s.src=url+"&callback="+cb;document.head.appendChild(s);
  });
}
async function itunes(params){
  const url="https://itunes.apple.com/"+params;
  try{const r=await fetch(url);if(r.ok)return await r.json()}catch(e){}
  return jsonp(url);
}
function msg(html){const m=$("searchMsg");m.hidden=!html;m.innerHTML=html||""}
function clean(n){return n.replace(/ - (EP|Single)$/i,"")}
function isFull(a){return a.trackCount>3&&!/ - Single$/i.test(a.collectionName)}
function sec(text){const h=document.createElement("div");h.className="sec";h.textContent=text;$("results").appendChild(h)}
function albumBtn(a){
  const b=document.createElement("button");b.type="button";b.className="result";
  const img=document.createElement("img");img.src=a.artworkUrl100;img.alt="";
  const t=document.createElement("div");t.textContent=clean(a.collectionName);
  const s=document.createElement("small");
  const yr=a.releaseDate?new Date(a.releaseDate).getFullYear():"";
  s.textContent=`${a.artistName} · ${yr} · ${a.trackCount} canciones`;t.appendChild(s);
  b.append(img,t);b.addEventListener("click",()=>pickAlbum(a));
  $("results").appendChild(b);
}
let lastSearch=null;
async function showArtist(ar){
  $("results").innerHTML="";msg("Cargando discografía…");
  try{
    const d=await itunes(`lookup?id=${ar.artistId}&entity=album&limit=200&country=MX`);
    const all=d.results.filter(x=>x.wrapperType==="collection");
    const full=all.filter(isFull);
    const list=(full.length?full:all).sort((x,y)=>new Date(y.releaseDate)-new Date(x.releaseDate));
    msg(list.length?"":"Este artista no tiene álbumes disponibles.");
    const back=document.createElement("button");back.type="button";back.className="back";back.textContent="← Volver a resultados";
    back.addEventListener("click",()=>lastSearch&&renderSearch(lastSearch));
    $("results").appendChild(back);
    sec(`Discografía de ${ar.artistName}`);
    list.forEach(albumBtn);
  }catch(e){msg("No pude cargar la discografía.")}
}
function renderSearch({artists,albums}){
  $("results").innerHTML="";
  if(!artists.length&&!albums.length){msg("No encontré nada. Revisa cómo está escrito.");return}
  msg("");
  if(artists.length){
    sec("Artistas");
    const c=document.createElement("div");c.className="chips";
    artists.forEach(ar=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=ar.artistName;b.addEventListener("click",()=>showArtist(ar));c.appendChild(b)});
    $("results").appendChild(c);
  }
  if(albums.length){sec("Álbumes");albums.forEach(albumBtn)}
}
$("searchForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const q=$("q").value.trim();if(!q)return;
  $("results").innerHTML="";msg("Buscando…");
  try{
    const term=encodeURIComponent(q);
    const [ar,al]=await Promise.all([
      itunes(`search?term=${term}&entity=musicArtist&limit=4&country=MX`),
      itunes(`search?term=${term}&entity=album&limit=60&country=MX`)
    ]);
    const all=al.results.filter(a=>a.collectionId);
    const full=all.filter(isFull);
    lastSearch={artists:ar.results.filter(a=>a.artistId),albums:(full.length?full:all).slice(0,8)};
    renderSearch(lastSearch);
  }catch(err){
    msg("<b>La búsqueda no está disponible en esta vista previa.</b> Funciona cuando la app se publica en su propio sitio. Mientras, usa “Escribir las canciones a mano”.");
    $("manual").open=true;
  }
});
async function pickAlbum(a){
  msg("Cargando canciones…");$("results").innerHTML="";
  try{
    const d=await itunes(`lookup?id=${a.collectionId}&entity=song&country=MX`);
    const songs=d.results.filter(x=>x.wrapperType==="track")
      .sort((x,y)=>(x.discNumber-y.discNumber)||(x.trackNumber-y.trackNumber))
      .map(x=>x.trackName);
    msg("");setAlbum(clean(a.collectionName),a.artistName,songs);
  }catch(e){msg("No pude cargar las canciones de ese álbum.")}
}

// ===== captura manual =====
$("mLoad").addEventListener("click",()=>{
  const titles=$("mTracks").value.split("\n").map(s=>s.trim()).filter(Boolean);
  if(!titles.length)return;
  setAlbum($("mAlbum").value.trim()||"Mi álbum",$("mArtist").value.trim(),titles);
  $("manual").open=false;
});
$("resetBtn").addEventListener("click",()=>{state.tracks.forEach(t=>t.tier=-1);selected=null;render()});

// ===== imagen 1080x1920 =====
function wrapLines(ctx,text,maxW){
  const words=text.split(" ");const lines=[];let cur="";
  words.forEach(w=>{const test=cur?cur+" "+w:w;if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=w}else cur=test});
  if(cur)lines.push(cur);return lines;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
async function exportImage(){
  await document.fonts.ready;
  const W=1080,H=1920,c=document.createElement("canvas");c.width=W;c.height=H;
  const ctx=c.getContext("2d");
  ctx.fillStyle=css("--bg");ctx.fillRect(0,0,W,H);
  // encabezado
  const M=48;let y=150;
  ctx.fillStyle=css("--fg");ctx.font=`800 64px ${css("--display")}`;ctx.textBaseline="alphabetic";
  const tl=wrapLines(ctx,state.album||"Mi álbum",W-2*M).slice(0,2);
  tl.forEach(l=>{ctx.fillText(l,M,y);y+=70});
  ctx.fillStyle=css("--muted");ctx.font=`600 34px ${css("--body")}`;
  if(state.artist){ctx.fillText(state.artist,M,y);y+=20}
  y+=30;
  // filas
  const labW=200,gap=12,area=W-2*M-labW-gap*2,bottom=H-130;
  let cols=4,tileH=120;
  const counts=TIERS.map((_,i)=>state.tracks.filter(t=>t.tier===i).length);
  for(;;){
    const lines=counts.map(n=>Math.max(1,Math.ceil(n/cols)));
    const total=lines.reduce((s,l)=>s+l*tileH+(l-1)*8+24,0)+gap*(TIERS.length-1);
    if(y+total<=bottom||tileH<=60){break}
    if(cols<5)cols++;else tileH-=8;
  }
  const tileW=(area-(cols-1)*8)/cols;
  TIERS.forEach((tr,i)=>{
    const items=state.tracks.filter(t=>t.tier===i);
    const lines=Math.max(1,Math.ceil(items.length/cols));
    const rowH=lines*tileH+(lines-1)*8+24;
    ctx.fillStyle=css("--row");rr(ctx,M,y,W-2*M,rowH,28);
    ctx.fillStyle=css(tr.color);rr(ctx,M,y,labW,rowH,28);
    ctx.fillStyle="#1a1a1a";ctx.font=`800 46px ${css("--display")}`;ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(tr.label,M+labW/2,y+rowH/2);
    items.forEach((t,k)=>{
      const cx=M+labW+gap+(k%cols)*(tileW+8),cy=y+12+Math.floor(k/cols)*(tileH+8);
      ctx.fillStyle=css("--tile");rr(ctx,cx,cy,tileW,tileH,20);
      ctx.fillStyle=css("--tile-fg");
      let fs=30,ls;
      do{ctx.font=`700 ${fs}px ${css("--body")}`;ls=wrapLines(ctx,t.title,tileW-20);fs-=2}
      while((ls.length*fs*1.15>tileH-16||ls.some(l=>ctx.measureText(l).width>tileW-16))&&fs>14);
      const lh=(fs+2)*1.15,sy=cy+tileH/2-(ls.length-1)*lh/2;
      ls.forEach((l,j)=>ctx.fillText(l,cx+tileW/2,sy+j*lh));
    });
    ctx.textAlign="left";ctx.textBaseline="alphabetic";
    y+=rowH+gap;
  });
  ctx.fillStyle=css("--muted");ctx.font=`600 30px ${css("--body")}`;ctx.textAlign="center";
  ctx.fillText("Haz la tuya: link en mi historia",W/2,H-70);
  return c;
}
let lastBlob=null;
$("exportBtn").addEventListener("click",async()=>{
  const c=await exportImage();
  $("previewImg").src=c.toDataURL("image/png");$("preview").hidden=false;
  c.toBlob(b=>lastBlob=b,"image/png");
  $("preview").scrollIntoView({behavior:"smooth",block:"start"});
});
$("saveBtn").hidden=false;
$("saveBtn").textContent="Guardar o compartir";
$("saveBtn").addEventListener("click",async()=>{
  if(!lastBlob)return;
  const name=(state.album||"tierlist").replace(/[^\w\- ]+/g,"")+" tierlist.png";
  const file=new File([lastBlob],name,{type:"image/png"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(lastBlob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
});

// ===== inicio =====
render();
</script>

</body>
</html>
